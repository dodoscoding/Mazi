<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mazi · Private memories</title>
<style>
  :root { color-scheme: light; font: 16px/1.5 system-ui,sans-serif; background:#f7f3ed; color:#28231e }
  body { max-width: 860px; padding: 1rem; margin: auto }
  header { display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #d6c9ba }
  h1 { font-size:1.6rem } h2 { margin-top:0 }
  section, article { background:white; border:1px solid #d6c9ba; border-radius:12px; padding:1rem; margin:1rem 0 }
  label { display:block; margin:.6rem 0 } input,select,button { font:inherit; padding:.55rem; max-width:100%; box-sizing:border-box }
  input:not([type=checkbox]), select { width:100% } button { cursor:pointer; border:0; border-radius:8px; background:#583d33; color:white; margin:.25rem .25rem .25rem 0 }
  button:focus-visible,input:focus-visible,select:focus-visible { outline:3px solid #a14d2c; outline-offset:2px }
  button.secondary { background:#dfd2c4; color:#28231e } #notice { min-height:2rem; font-weight:600 }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:1rem }
  .hidden { display:none } img { max-width:100%; max-height:260px; object-fit:contain }
  small { color:#665b50 } .cards { display:grid; gap:.5rem }
  @media (prefers-reduced-motion: reduce) { *,*::before,*::after { scroll-behavior:auto!important; animation:none!important } }
</style>
<header><h1>Mazi</h1><button id="logout" class="secondary hidden">Sign out</button></header>
<p>Private memories for a small group. This local pilot supports JPEG and PNG images up to 20 MB.</p>
<p id="notice" role="status" aria-live="polite"></p>

<section id="auth" class="grid">
  <form id="register"><h2>Create account</h2><label>Email<input name="email" type="email" required autocomplete="email"></label><label>Password (12+ characters)<input name="password" type="password" minlength="12" required autocomplete="new-password"></label><button>Create account</button></form>
  <form id="login"><h2>Sign in</h2><label>Email<input name="email" type="email" required autocomplete="email"></label><label>Password<input name="password" type="password" required autocomplete="current-password"></label><button>Sign in</button></form>
</section>

<main id="workspace" class="hidden">
  <section><h2>Groups</h2><div id="groups"></div><form id="create-group"><label>New group name<input name="name" required maxlength="100"></label><button>Create group</button></form><form id="accept"><label>Invitation token<input name="token" required></label><button>Join group</button></form></section>
  <section id="group-work" class="hidden"><h2 id="group-title"></h2><button id="invite" class="secondary">Create 24-hour invite</button><button id="revoke-invite" class="secondary" hidden>Revoke latest invite</button><button id="export" class="secondary">Export what I can see</button><p id="invite-result"></p><h3>Members</h3><div id="members"></div>
    <div class="grid">
      <form id="upload"><h3>Stage an image privately</h3><label>Image<input name="file" type="file" accept="image/jpeg,image/png" required></label><label>Caption<input name="caption" maxlength="2000"></label><label>Capture date<input name="capture_date" type="date"></label><progress id="upload-progress" max="100" value="0" aria-label="Upload progress"></progress><button>Upload for review</button></form>
      <form id="create-memory"><h3>Make a memory</h3><label>Title<input name="title" required maxlength="200"></label><label>Staged image IDs (comma separated)<input name="media_ids" id="memory-media-ids"></label><button>Create private draft</button></form>
    </div>
    <h3>My staged images</h3><div id="staged" class="cards"></div>
    <h3>My draft memories</h3><div id="drafts" class="cards"></div>
    <h3>Timeline</h3><label>Search titles and visible captions<input id="search" type="search"></label><div id="timeline" class="cards"></div><button id="more" class="secondary">Load more</button>
  </section>
</main>
<script src="/app.js" defer></script>
</html>
