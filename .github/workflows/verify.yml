name: Verify
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  unified-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run setup
      - run: npm run test:dom
      - run: npx playwright install --with-deps chromium firefox
      - run: npm run lint
      - run: npm run build
      - run: npm run check:budgets
      - run: npm run check:docs
      - run: npm run test:backend
      - run: npm run eval:retrieval
      - run: npm run eval:answers
      - run: npm test
      - run: npm run test:app
        env:
          MAZI_PYTHON: .venv/bin/python
      - run: npm run test:domains
        env:
          MAZI_PYTHON: .venv/bin/python
          MAZI_BROWSER_RESULTS_DIR: ${{ github.workspace }}/test-results/domains
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unified-browser-evidence
          path: test-results/
  import-workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run setup
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config playwright.imports.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: import-workspace-evidence
          path: test-results/import-workspace/
  m0-access:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run m0:start
      - run: npm run test:m0
      - run: npx supabase db advisors --local --type security --fail-on error
      - run: npx supabase stop
        if: always()
  macos-companion:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh tools/apple-photos/build.sh
  learned-retrieval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run setup
      - run: .venv/bin/python -m pip install -r mazi/discovery/requirements-clip.txt
      - uses: actions/cache@v4
        with:
          path: .models/clip-vit-base-patch32
          key: clip-b32-d15189d7028b43f1d3e65039190477f6af591c2a
      - run: npm run setup:discovery:model
      - run: .venv/bin/python -m unittest tests.backend.discovery.test_clip_runtime -v
        env:
          MAZI_EMBEDDING_MODEL_DIR: .models/clip-vit-base-patch32
      - run: npm run eval:retrieval:clip
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:domains -- discovery-learned.spec.ts --project discovery-desktop --project discovery-phone
        env:
          MAZI_PYTHON: .venv/bin/python
          MAZI_EMBEDDING_MODEL_DIR: .models/clip-vit-base-patch32
          MAZI_BROWSER_RESULTS_DIR: ${{ github.workspace }}/test-results/learned
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: learned-browser-evidence
          path: test-results/
