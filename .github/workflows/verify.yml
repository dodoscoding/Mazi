name: Verify
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:dom
      - run: npm run lint
      - run: npm run build
      - run: npm run check:budgets
      - run: npm run check:docs
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:unit
      - run: npm run setup
      - run: npm run test:backend
      - run: npm run eval:retrieval
      - run: npm run eval:answers
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: sample
            browsers: chromium firefox
            command: npx playwright test --output test-results/sample
          - suite: unified
            browsers: chromium
            command: npx playwright test --config playwright.unified.config.ts --output test-results/unified
          - suite: conversations
            browsers: chromium
            command: npx playwright test --config playwright.conversations.config.ts --output test-results/conversations
          - suite: photos
            browsers: chromium
            command: npx playwright test --config playwright.photos.config.ts --output test-results/photos
          - suite: workflows
            browsers: chromium
            command: |
              npx playwright test --config playwright.add-sources.config.ts --output test-results/add-sources
              npx playwright test --config playwright.add-queues.config.ts --output test-results/add-queues
              npx playwright test --config playwright.recap.config.ts --output test-results/recap
              npx playwright test --config playwright.past-creations.config.ts --output test-results/past-creations
          - suite: domains
            browsers: chromium
            command: npm run build && npm run test:domains
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run setup
      - run: npx playwright install --with-deps ${{ matrix.browsers }}
      - run: ${{ matrix.command }}
        env:
          MAZI_PYTHON: .venv/bin/python
          MAZI_BROWSER_RESULTS_DIR: ${{ github.workspace }}/test-results/domains
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unified-browser-evidence-${{ matrix.suite }}
          path: test-results/
  unified-app:
    if: always()
    needs: [checks, backend, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: test "$CHECKS" = success && test "$BACKEND" = success && test "$BROWSER" = success
        env:
          CHECKS: ${{ needs.checks.result }}
          BACKEND: ${{ needs.backend.result }}
          BROWSER: ${{ needs.browser.result }}
  import-workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run setup
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config playwright.imports.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: import-workspace-evidence
          path: test-results/import-workspace/
  m0-access:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run m0:start
      - run: npm run test:m0
      - run: npx supabase db advisors --local --type security --fail-on error
      - run: npx supabase stop
        if: always()
  macos-companion:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh tools/apple-photos/build.sh
  learned-retrieval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run setup
      - run: .venv/bin/python -m pip install -r mazi/discovery/requirements-clip.txt
      - uses: actions/cache@v4
        with:
          path: .models/clip-vit-base-patch32
          key: clip-b32-d15189d7028b43f1d3e65039190477f6af591c2a
      - run: npm run setup:discovery:model
      - run: .venv/bin/python -m unittest tests.backend.discovery.test_clip_runtime -v
        env:
          MAZI_EMBEDDING_MODEL_DIR: .models/clip-vit-base-patch32
      - run: npm run eval:retrieval:clip
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:domains -- discovery-learned.spec.ts --project discovery-desktop --project discovery-phone
        env:
          MAZI_PYTHON: .venv/bin/python
          MAZI_EMBEDDING_MODEL_DIR: .models/clip-vit-base-patch32
          MAZI_BROWSER_RESULTS_DIR: ${{ github.workspace }}/test-results/learned
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: learned-browser-evidence
          path: test-results/
