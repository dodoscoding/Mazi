<div class="memories-page">
  <nav class="feature-sections" aria-label="Anı bölümleri">
    <a href="#/memories">Fotoğraflar</a>
    <a href="#/memories?section=recap">Yıllık özet</a>
  </nav>
  <div class="mem-layout">
    <div id="filters-scrim" class="mem-scrim" hidden></div>
    <aside
      id="memory-filters"
      class="mem-filters"
      aria-labelledby="filters-title"
    >
      <span class="mem-sheet-handle" aria-hidden="true"></span>
      <div class="mem-filters-head">
        <h2 id="filters-title" class="mem-filters-title">Filtreler</h2>
        <button id="filters-reset" type="button" class="mem-text-button">
          Temizle
        </button>
      </div>
      <fieldset class="mem-fieldset">
        <legend>Yıl</legend>
        <div id="filter-years" class="mem-chips"></div>
      </fieldset>
      <fieldset id="place-filter" class="mem-fieldset">
        <legend>Yer</legend>
        <div id="filter-places" class="mem-checks"></div>
      </fieldset>
      <fieldset id="person-filter" class="mem-fieldset">
        <legend>Paylaşan</legend>
        <div id="filter-people" class="mem-chips mem-people"></div>
      </fieldset>
      <fieldset id="source-filter" class="mem-fieldset">
        <legend>Kaynak</legend>
        <div id="filter-sources" class="mem-checks"></div>
      </fieldset>
      <div class="mem-switch-row">
        <span id="uncertain-label">Yalnız belirsiz tarihler</span>
        <button
          id="filter-uncertain"
          type="button"
          role="switch"
          aria-checked="false"
          aria-labelledby="uncertain-label"
          class="mem-switch"
        >
          <i></i>
        </button>
      </div>
      <div class="mem-sheet-foot">
        <button id="filters-apply" type="button" class="mem-apply">
          Fotoğrafları göster
        </button>
      </div>
    </aside>
    <div class="mem-main">
      <header class="mem-head">
        <div class="mem-heading">
          <h1 class="mem-title">Fotoğraflar</h1>
          <p id="grid-summary" class="mem-summary"></p>
        </div>
        <div class="mem-controls">
          <label class="mem-group">Grup<select id="groups"></select></label>
          <div
            id="grid-view"
            class="br-segmented"
            role="group"
            aria-label="Görünüm"
          >
            <button type="button" aria-pressed="true" data-view="moment">
              Anılara göre
            </button>
            <button type="button" aria-pressed="false" data-view="all">
              Tüm fotoğraflar
            </button>
          </div>
          <button id="grid-order" type="button" class="mem-pill">
            <span class="visually-hidden">Sıra: </span
            ><span id="grid-order-label">Önce en yeni</span>
          </button>
          <button
            id="filters-open"
            type="button"
            class="mem-pill mem-filters-button"
            aria-expanded="false"
            aria-controls="memory-filters"
          >
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              aria-hidden="true"
            >
              <path d="M4 6h16M7 12h10M10 18h4" /></svg
            ><span class="mem-wide-label">Diğer filtreler</span
            ><span class="mem-narrow-label">Filtreler</span
            ><span id="filters-count"></span>
          </button>
        </div>
      </header>
      <div
        id="year-chips"
        class="mem-chips mem-year-row"
        role="group"
        aria-label="Yıllar"
      ></div>
      <div
        id="active-filters"
        class="mem-active"
        role="group"
        aria-label="Etkin filtreler"
      ></div>
      <div id="grid" class="mem-grid"></div>
    </div>
  </div>

  <section class="mem-stories" aria-labelledby="recap-heading">
    <h2 id="recap-heading" tabindex="-1">Annual recap</h2>
    <form id="year-form" class="mem-year-form">
      <label
        >Year<input
          id="year"
          type="number"
          min="1"
          max="9999"
          value="2024"
          required /></label
      ><button>Show year</button>
    </form>
    <p id="notice" role="status"></p>
    <section id="recap" aria-label="Annual recap"></section>
    <button id="refresh" type="button" class="mem-refresh">
      Refresh recap
    </button>
  </section>
</div>
