<div class="fx">
  <section class="fx-panel" aria-labelledby="settings-archive-title">
    <h2 id="settings-archive-title" class="fx-section-title">
      Archive and contributions
    </h2>
    <p id="settings-notice" role="status" aria-live="polite"></p>
    <button id="settings-retry" class="fx-button" hidden>
      Retry Settings controls
    </button>
    <div id="settings-work" hidden>
      <p>
        Download the originals, context and evidence currently available to you
        within the archive’s existing export limits.
      </p>
      <button id="settings-export" class="fx-button">Download archive</button>
      <button id="settings-cancel-export" class="fx-button" hidden>
        Cancel export
      </button>
      <h3>My contributions</h3>
      <p>
        Removing your source record stops sharing it immediately. Independent
        contributions remain available.
      </p>
      <div id="settings-mine" class="thumb-cards"></div>
      <button
        id="settings-leave"
        class="fx-button fx-button--danger-quiet"
        hidden
      >
        Leave group and withdraw my contributions
      </button>
    </div>
  </section>
</div>
